# Build the desktop app on the three platforms it claims to support.
#
# The roadmap's packaging milestone asks to exercise Windows and macOS before
# deciding what gets signed, and this is that exercise: it proves the native
# DuckDB backend compiles, that each host can vendor its own ABI-specific Excel
# extension, and that Tauri produces the bundles. Signing and notarisation are
# deliberately absent — they are worth adding only for platforms that will
# actually be distributed.
#
# Note the explicit artefact check at the end of the bundle step. `cargo tauri
# build` exits 0 even when a bundler fails, which is how a missing AppImage
# went unnoticed locally, so the exit status alone is not evidence of a build.

name: desktop

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push makes an in-flight build for the same ref pointless.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The engine tests are platform-independent and much faster than a bundle,
  # so they run once and gate the three builds rather than repeating in each.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      - name: Vendor DuckDB
        run: mise run vendor
      - name: Compile the notebook shell
        run: mise run build
      - name: Engine tests
        run: mise run test
      - name: Fixtures against a real DuckDB
        run: mise run roundtrip

  bundle:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          # Not macos-13: that image was retired in December 2025, and a job
          # asking for it is never scheduled — it simply sits queued with no
          # runner until it ages out, which is how one sat "in progress" for
          # five hours. macos-15-intel is the standard-runner replacement, and
          # is the last of its line: Apple has dropped x86_64, so GitHub retires
          # Intel macOS altogether once macos-15 goes in autumn 2027.
          - os: macos-15-intel
            name: macos-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri needs the system webview and its build headers. macOS and Windows
      # ship theirs; only Linux has to be told.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file

      - uses: jdx/mise-action@v2
        with:
          experimental: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      # Not through mise: the local `release` task shells into the distrobox
      # container this project builds in, which does not exist on a runner.
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      # mise unpacks elm-0.19.2-windows-x64.gz to a file named `elm`, with no
      # extension, and `mise ls` duly lists the tool as installed. Windows only
      # treats a file as executable if its extension says so, so nothing can
      # actually run it: `mise which elm` (which looks for elm.exe) reports
      # nothing, and cmd, which the mise tasks shell out to, answers every
      # `elm make` with "not recognized as an internal or external command".
      #
      # Copying it to elm.exe satisfies both, and putting that directory on
      # PATH means the tasks resolve elm even though mise's own lookup cannot.
      # The install tree is printed first so that a wrong diagnosis shows up in
      # the log rather than failing the build the same way a third time.
      - name: Give Windows an executable elm
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -uo pipefail
          root=$(mise where elm 2>/dev/null || true)
          if [ -z "$root" ] || [ ! -d "$root" ]; then
            root=$(mise ls --json | node -e "
              let raw = '';
              process.stdin.on('data', chunk => raw += chunk);
              process.stdin.on('end', () => {
                const [elm] = JSON.parse(raw).elm || [];
                process.stdout.write(elm ? elm.install_path : '');
              });
            ")
          fi
          echo "elm install path -> ${root:-<unresolved>}"
          if [ -z "$root" ] || [ ! -d "$root" ]; then
            echo "::error::mise lists elm as installed but reports no path for it"
            mise ls || true
            exit 1
          fi
          find "$root" -maxdepth 3
          binary=$(find "$root" -maxdepth 3 -type f \( -name elm -o -name elm.exe \) \
            | head -n 1)
          if [ -z "$binary" ]; then
            echo "::error::mise installed elm but no elm binary exists under $root"
            exit 1
          fi
          dir=$(dirname "$binary")
          [ -f "$dir/elm.exe" ] || cp "$binary" "$dir/elm.exe"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/elm.exe" --version || true

      - name: Vendor DuckDB for this host
        run: mise run vendor

      - name: Compile the notebook shell
        run: mise run build

      - name: Bundle
        working-directory: src-tauri
        # Both variables are for linuxdeploy rather than Tauri, and both are
        # no-ops off Linux. APPIMAGE_EXTRACT_AND_RUN lets an AppImage run where
        # FUSE 2 is absent; NO_STRIP stops linuxdeploy's bundled strip choking
        # on the `.relr.dyn` sections current Linux libraries carry.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: 1
        run: cargo tauri build

      # `cargo tauri build` reports success even when a bundler failed, so the
      # artefacts themselves are the only trustworthy evidence.
      #
      # Uses find rather than a glob: macOS runners still ship bash 3.2, which
      # has no globstar, and `shell: bash` runs with -e — so `shopt -s globstar`
      # aborts the step on the one platform this most needed to check. `.app` is
      # a directory, hence -prune and du rather than stat.
      - name: Check that bundles were produced
        shell: bash
        run: |
          root=src-tauri/target/release/bundle
          found=$(find "$root" \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.app' \) -prune -print 2>/dev/null)
          if [ -z "$found" ]; then
            echo "::error::cargo tauri build exited 0 but produced no bundle"
            find "$root" -maxdepth 2 2>/dev/null || true
            exit 1
          fi
          echo "$found" | while IFS= read -r f; do
            printf '%8s  %s\n' "$(du -sh "$f" | cut -f1)" "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: duckpad-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 14
