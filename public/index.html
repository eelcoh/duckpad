<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acadia notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fira Code for its programming ligatures: the DSL leans on exactly the
     sequences they improve (|> -> == /= >= <=). IBM Plex Sans was already
     named in the stack but never loaded. -->
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  /* elm-ui owns the layout. What is left here is the three things it is
     deliberately bad at: two layers that must agree on exact text metrics,
     rendered Markdown, and a table with a sticky header. */
  :root {
    --ink: #1b1f23;
    --muted: #6b7280;
    --line: #e3e6ea;
    --card: #ffffff;
    --accent: #2f5d8a;
    --mono: "Fira Code", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  }
  html, body { margin: 0; padding: 0; }

  /* Fira Code turns ligatures on through `calt`; stating it means a fallback
     face that also has them behaves the same. */
  pre, textarea, .artefact-pre, table {
    font-variant-ligatures: contextual;
    font-feature-settings: "calt" 1;
  }

  /* THE EDITOR: a coloured <pre> with a transparent textarea exactly on top.
     Every property that affects where a glyph lands is set once, for both
     layers, rather than twice in a way that happens to match today. */
  .editor { position: relative; width: 100%; }
  .editor > .highlight,
  .editor > .cell-source {
    margin: 0;
    padding: 12px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.55;
    letter-spacing: normal;
    tab-size: 2;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-break: break-word;
    border: 0;
  }
  .editor > .highlight { color: var(--ink); pointer-events: none; }
  .editor > .cell-source {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    resize: none;
    overflow: hidden;
    background: transparent;
    color: transparent;
    caret-color: var(--ink);
  }
  .editor > .cell-source:focus { outline: none; }
  .editor > .cell-source::selection { background: #cfe3f5; }

  .tok-keyword  { color: #2f5d8a; font-weight: 500; }
  .tok-aggregate{ color: #7a4ea8; }
  .tok-type     { color: #7a4ea8; font-weight: 500; }
  .tok-field    { color: #17706e; }
  .tok-string   { color: #a3543a; }
  .tok-number   { color: #a3543a; }
  .tok-operator { color: #8a919a; }
  .tok-comment  { color: #9aa3ac; font-style: italic; }
  .tok-plain    { color: var(--ink); }

  /* PROSE: rendered Markdown, and the textarea it becomes when clicked. The
     two need the same box or the cell jumps as it switches. */
  textarea.cell-source {
    width: 100%; border: 0; padding: 12px; background: transparent;
    font-family: var(--sans); font-size: 13.5px; line-height: 1.6; color: var(--ink);
    resize: vertical;
  }
  textarea.cell-source:focus { outline: none; }
  .prose-body { padding: 12px; cursor: text; min-height: 46px; }
  .prose-body:hover { background: #fcfdff; }
  .prose-empty { color: var(--muted); font-size: 13.5px; font-family: var(--sans); }

  .prose-rendered { font-family: var(--sans); font-size: 14px; line-height: 1.65; color: #33393f; }
  .prose-rendered > *:first-child { margin-top: 0; }
  .prose-rendered > *:last-child { margin-bottom: 0; }
  .prose-rendered h1, .prose-rendered h2, .prose-rendered h3,
  .prose-rendered h4, .prose-rendered h5, .prose-rendered h6 {
    color: var(--ink); font-weight: 600; line-height: 1.3; margin: 1.1em 0 0.45em;
    letter-spacing: -0.01em;
  }
  .prose-rendered h1 { font-size: 22px; }
  .prose-rendered h2 { font-size: 18px; }
  .prose-rendered h3 { font-size: 15.5px; }
  .prose-rendered h4, .prose-rendered h5, .prose-rendered h6 { font-size: 14px; }
  .prose-rendered p { margin: 0 0 0.75em; }
  .prose-rendered ul, .prose-rendered ol { margin: 0 0 0.75em; padding-left: 1.4em; }
  .prose-rendered li { margin: 0.15em 0; }
  .prose-rendered code {
    font-family: var(--mono); font-size: 12.5px; background: #f2f4f6;
    padding: 1px 4px; border-radius: 3px;
  }
  .prose-rendered pre { background: #f7f8f9; padding: 10px 12px; border-radius: 5px; overflow-x: auto; }
  .prose-rendered pre code { background: none; padding: 0; }
  .prose-rendered blockquote {
    margin: 0 0 0.75em; padding-left: 12px; border-left: 3px solid var(--line);
    color: var(--muted);
  }
  .prose-rendered a { color: var(--accent); }
  .prose-rendered hr { border: none; border-top: 1px solid var(--line); margin: 1.2em 0; }
  .prose-raw { white-space: pre-wrap; font-family: var(--mono); font-size: 12.5px; color: var(--muted); }

  /* THE RESULT TABLE: a sticky header over a scrolling body. */
  .result-meta {
    padding: 8px 12px; font-size: 11px; color: var(--muted); font-family: var(--mono);
    border-top: 1px solid var(--line);
  }
  .table-scroll { overflow-x: auto; max-height: 320px; overflow-y: auto; border-top: 1px solid var(--line); }
  .table-scroll table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 11.5px; }
  .table-scroll th {
    text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--card); font-weight: 600; white-space: nowrap;
  }
  .coltype { display: block; font-size: 9px; color: var(--muted); font-weight: 400; text-transform: lowercase; }
  .table-scroll td { padding: 4px 12px; border-bottom: 1px solid #f3f4f6; white-space: nowrap; }
  .table-scroll tbody tr:hover { background: #fafbfc; }

  .artefact-pre {
    margin: 0; font-family: var(--mono); font-size: 11px; line-height: 1.5;
    white-space: pre; overflow-x: auto; max-width: 100%; color: var(--ink);
  }
</style>
</head>
<body>
  <div id="notebook"></div>
  <script src="elm.js"></script>
  <script type="module" src="duckdb-bridge.js"></script>
</body>
</html>
