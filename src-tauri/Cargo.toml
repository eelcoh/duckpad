[package]
name = "duckpad"
version = "0.1.0"
edition = "2021"
description = "A reactive, typed notebook over DuckDB"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
duckdb = { version = "~1.10505.0", features = ["bundled", "json", "parquet"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
