# `elm make` keeps its build cache in a single elm-stuff/ directory derived from
# elm.json, and two compilers racing on it corrupt it — "CORRUPT CACHE ... not
# enough bytes", intermittently, on a cold cache. `build` fans out to seed,
# chart-spike and vendored, two of which compile Elm, so mise's default
# parallelism made that race reachable on every clean checkout, which is to say
# on every CI run. Elm offers no way to relocate elm-stuff per invocation, so
# the only fix is not to run two of them at once.
#
# Serialising every task rather than just the Elm ones costs nothing here — the
# whole graph is a couple of seconds — and it stays correct when someone adds a
# fourth task that shells into elm without remembering this.
[settings]
jobs = 1

[tools]
duckdb = "latest"
elm = { version = "0.19.2", bin = "elm" }
node = "26"

[tasks.vendor]
description = "Download DuckDB and its Excel extensions so the app runs offline"
run = """
node tools/vendor.js
node tools/vendor-native.js
"""

[tasks.build]
description = "Compile the Elm notebook shell"
depends = ["seed", "vendored", "chart-spike"]
run = "elm make src/Main.elm --output=public/elm.js"

[tasks.chart-spike]
description = "Compile the elm-charts parity spike"
run = "elm make tools/ElmChartsSpike.elm --output=public/chart-spike.js"

[tasks.serve]
description = "Serve the notebook at http://localhost:8080 (build first)"
run = "python3 tools/serve.py 8080 public"

[tasks.test]
description = "Compile and run the engine test suite under node"
run = """
elm make tests/TestRunner.elm --output=tests/tests.js
node tests/run.js
node tests/wiring.js
node tests/chart-migration.js
node tests/startup.mjs
node tests/recents.mjs
node tests/home.js
node tests/zoom.mjs
"""

[tasks.roundtrip]
description = "Execute every fixture's generated SQL in DuckDB and compile its generated Elm"
run = """
elm make tests/Fixtures.elm --output=tests/fixtures.js
node tests/roundtrip.js
"""

[tasks.seed]
description = "Write the seeded notebook out to public/"
run = """
elm make tools/EmitSeed.elm --output=tools/seed.js
node tools/emit-seed.js
"""

[tasks.desktop]
description = "Run duckpad as a desktop app (the Rust side builds in the duckpad-tauri container)"
depends = ["build"]
run = "distrobox enter duckpad-tauri -- bash -lc 'cd ~/Code/ideas/duckpad/src-tauri && cargo tauri dev'"

# Two environment variables are load-bearing, both for linuxdeploy rather
# than for Tauri. APPIMAGE_EXTRACT_AND_RUN lets an AppImage run without FUSE 2,
# which the toolbox container does not have. NO_STRIP stops linuxdeploy calling
# its own 2024-vintage strip, which does not understand the `.relr.dyn`
# sections modern Fedora libraries carry and fails the bundle outright.
#
# Note that `cargo tauri build` exits 0 even when a bundle fails, so a broken
# AppImage is silent: check that all three artefacts exist rather than the
# exit status.
[tasks.release]
description = "Build the desktop release bundles (deb, rpm, AppImage)"
depends = ["build"]
run = """
distrobox enter duckpad-tauri -- bash -lc 'cd ~/Code/ideas/duckpad/src-tauri && APPIMAGE_EXTRACT_AND_RUN=1 NO_STRIP=1 cargo tauri build'
"""

# `desktop` and `release` enter the duckpad-tauri distrobox because the Fedora
# host this project is developed on has no webkit2gtk development headers and
# is not going to grow them. macOS and Windows need no such container: their
# webview ships with the OS, so cargo tauri runs straight against the host
# toolchain. These two tasks are that path, and they are the builds CI runs —
# which is why CI invokes cargo tauri itself rather than going through mise.
#
# The exit-status warning above applies here too: a bundler can fail while
# `cargo tauri build` still exits 0. Checking for the artefacts is left to CI
# rather than inlined, because a task body runs under sh on macOS and cmd on
# Windows and no one spelling of the check works on both.

[tasks.desktop-native]
description = "Run duckpad as a desktop app against the host toolchain (macOS, Windows)"
depends = ["build"]
dir = "src-tauri"
run = "cargo tauri dev"

[tasks.release-native]
description = "Build the desktop release bundles against the host toolchain (macOS, Windows)"
depends = ["build"]
dir = "src-tauri"
# The two linuxdeploy variables `release` documents above. They are no-ops on
# the platforms this task targets, and carrying them means it also works on a
# Linux host that has the headers installed and so skips the container.
env = { APPIMAGE_EXTRACT_AND_RUN = "1", NO_STRIP = "1" }
run = "cargo tauri build"

[tasks.vendored]
description = "Vendor the third-party JavaScript if it is not already there"
hide = true
run = """
node tools/clean-retired-vega.js
node tools/vendor.js --check || node tools/vendor.js
node tools/vendor-native.js --check || node tools/vendor-native.js
"""
